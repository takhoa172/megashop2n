name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run backend tests
        run: |
          cp .env.example .env
          docker compose run --rm django python manage.py test --noinput

      - name: Run frontend lint
        run: |
          cd frontend
          npm ci
          npm run lint

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Deploy via Cloudflare Tunnel
        run: |
          cloudflared access tcp \
            --hostname ${{ secrets.SERVER_HOST }} \
            --url tcp://127.0.0.1:2222 \
            --id ${{ secrets.CF_ACCESS_CLIENT_ID }} \
            --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }} &
          sleep 5
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key
          ssh -o StrictHostKeyChecking=no -p 2222 -i /tmp/ssh_key \
            ${{ secrets.SERVER_USER }}@127.0.0.1 \
            "cd /opt/vietshop && git pull origin main && docker compose up -d --build && docker image prune -f"
